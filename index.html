<head>
    <meta charset="UTF-8">

    <title>Online Gaming Slots | Epic AAA Experience</title>
    <!-- Fonts: Cinzel for cinematic epic headers (Black Myth style), Inter for readable UI -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030303;
            --bg-surface: #0a0a0a;
            --border-dark: #1f1f1f;
            --border-gold: #b8860b;
            --border-gold-glow: rgba(184, 134, 11, 0.4);
            --text-main: #e0e0e0;
            --text-gold: #d4af37;
            --text-red: #8b0000;
            --accent-red: #5c0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Cinematic Background Fog/Embers */
        #ember-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
        }

        /* Typography */
        h1, h2, h3, .cinematic-text {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        /* Header */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.02);
            backdrop-filter: blur(5px);
        }
        .header-logo {
            height: 50px;
            mix-blend-mode: lighten;
            transition: all 0.5s ease;
            filter: grayscale(100%) contrast(1.2);
            opacity: 0.8;
        }
        .header-logo:hover {
            filter: grayscale(0%) contrast(1.2) drop-shadow(0 0 10px var(--border-gold-glow));
            opacity: 1;
            transform: scale(1.05);
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 20px 60px;
            display: flex;
            flex-direction: column;
            gap: 6rem;
        }

        /* Banner Section */
        .hero-banners {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media(min-width: 768px) {
            .hero-banners { grid-template-columns: 1fr 1fr; }
        }
        .banner-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 21/9;
            cursor: pointer;
            background: var(--bg-surface);
            border: 1px solid var(--border-dark);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
            transition: background 0.6s;
        }
        .banner-wrapper:hover::before {
            background: rgba(0, 0, 0, 0);
        }
        .banner-wrapper:hover {
            border-color: var(--border-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--border-gold-glow);
            transform: translateY(-5px);
        }
        .banner-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(80%) sepia(20%);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .banner-wrapper:hover img {
            transform: scale(1.05);
            filter: grayscale(0%) sepia(0%);
        }

        /* Hero / Jackpot Section */
        .jackpot-section {
            text-align: center;
            position: relative;
            padding: 4rem 0;
        }
        .jackpot-title {
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 0.3em;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }
        .jackpot-title::before, .jackpot-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 1px;
            background: var(--border-gold);
        }
        .jackpot-title::before { left: -70px; }
        .jackpot-title::after { right: -70px; }

        .jackpot-amount {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 900;
            color: var(--text-gold);
            text-shadow: 0 4px 20px rgba(184, 134, 11, 0.4), 0 0 40px rgba(0,0,0,0.8);
            letter-spacing: 0.05em;
            line-height: 1;
            background: linear-gradient(to bottom, #fff8dc 0%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        /* Game Grid - Dark Fantasy UI */
        .section-header {

        .game-grid {

            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .game-card {

            background: var(--bg-surface);
            border: 1px solid var(--border-dark);
            height: 380px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        .game-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            transition: border-color 0.5s;
            pointer-events: none;
            z-index: 5;
        }
        .game-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        .game-card:hover::after {
            border-color: var(--border-gold);
            box-shadow: inset 0 0 20px var(--border-gold-glow);
        }
        .game-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: grayscale(60%) brightness(0.6) contrast(1.2);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .game-card:hover .game-image {
            transform: scale(1.1);
            filter: grayscale(0%) brightness(1) contrast(1);
        }
        
        /* Card Content Layer */
        .game-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2rem 1.5rem 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(30px);
            transition: transform 0.5s ease;
            z-index: 2;
        }
        .game-card:hover .game-info {
            transform: translateY(0);
        }
        
        .game-name {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: color 0.3s;
        }
        .game-card:hover .game-name {
            color: var(--text-gold);
        }

        .play-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.6rem 2rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .game-card:hover .play-btn {
            opacity: 1;
            border-color: var(--border-gold);
            color: var(--text-gold);
        }
        .play-btn:hover {
            background: var(--border-gold);
            color: #000;
            box-shadow: 0 0 15px var(--border-gold-glow);
        }

        /* Call To Action */
        .cta-section {
            margin-top: 2rem;
            text-align: center;
            padding: 4rem 2rem;
            border-top: 1px solid var(--border-dark);
            border-bottom: 1px solid var(--border-dark);

            text-decoration: none;
            letter-spacing: 0.2em;

            background: #fff;
            box-shadow: 0 0 30px var(--border-gold-glow), 0 0 10px rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
    </style>

    <script>
        // Cinematic Embers Effect (Dark Fantasy Particle Engine)
        const canvas = document.getElementById('ember-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let embers = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Ember {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // initial random spread
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = -(Math.random() * 1.5 + 0.5); // float upwards
                this.life = Math.random() * 0.5 + 0.5;
                this.decay = Math.random() * 0.005 + 0.002;
                
                // Colors ranging from deep orange to yellow/white
                const hue = Math.random() * 30 + 10; 
                this.color = `hsla(${hue}, 100%, 60%, `;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                
                // Add some natural swooping motion
                this.speedX += (Math.random() - 0.5) * 0.05;

                if (this.life <= 0 || this.y < -10) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.max(0, this.life) + ')';
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsla(20, 100%, 50%, ${this.life})`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Initialize Embers
        for(let i = 0; i < 150; i++) {
            embers.push(new Ember());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < embers.length; i++) {
                embers[i].update();
                embers[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Animated Odometer Jackpot
        let currentJackpot = 24942810.00;
        const jackpotEl = document.getElementById('jackpot');
        setInterval(() => {
            currentJackpot += (Math.random() * 25); // Faster ticking for epic feel
            jackpotEl.innerText = '$' + currentJackpot.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }, 1500);
    </script>
