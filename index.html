<html lang="en" class="dark">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07070a;
            --surface-color: rgba(20, 20, 25, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary: #00E5FF;
            --secondary: #FF0055;
            --gold: #FFD700;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Canvas Background */
        #glitter-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Header */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }
        .header-logo {
            height: 60px;
            /* If the jpg is black bg, mix-blend-mode: screen/lighten removes the black. */
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.5));
            border-radius: 12px;
            transition: transform 0.3s;
        }
        .header-logo:hover { transform: scale(1.05); }

        /* Main Container */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        /* Hero Banners */
        .hero-banners {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
        }
        @media(min-width: 768px) {
            .hero-banners { grid-template-columns: 1fr 1fr; }
        }
        .banner-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            aspect-ratio: 21/9;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner-wrapper:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 40px rgba(0, 229, 255, 0.2);
            border-color: var(--primary);
        }
        .banner-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.7s;
        }
        .banner-wrapper:hover img { transform: scale(1.1); }

        /* Jackpot Section */
        .jackpot-section {
            border-radius: 30px;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .jackpot-section::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(255, 215, 0, 0.1), transparent 30%);
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(1turn); } }
        .jackpot-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
        }
        .jackpot-amount {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            background: linear-gradient(to right, #FFD700, #FFA500, #FFD700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.3));
            position: relative;
            z-index: 2;
        }

        @keyframes shine { to { background-position: 200% center; } }

        /* Game Grid */
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--surface-border), transparent);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .game-card {
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            aspect-ratio: 4/5;
        }
        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.95) 100%);
            z-index: 1;
        }
        .game-card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 229, 255, 0.4);
            border-color: rgba(0, 229, 255, 0.6);
            z-index: 10;
        }
        .game-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .game-card:hover .game-image {
            transform: scale(1.15);
        }
        .game-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2rem 1.5rem;
            z-index: 2;
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-card:hover .game-info {
            transform: translateY(0);
        }
        .game-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .play-btn {
            background: linear-gradient(90deg, var(--primary), #00b4db);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4);
        }
        .game-card:hover .play-btn { opacity: 1; }

        /* Telegram CTA */
        .cta-section {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.05), rgba(255, 0, 85, 0.05));
            border-radius: 30px;
            padding: 5rem 2rem;
            text-align: center;
            border: 1px solid rgba(0, 229, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .cta-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 1.2rem 3rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            background: var(--secondary);
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
            transition: all 0.3s;

        }
        .cta-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 0, 85, 0.6);
            background: #ff1a66;
        }
    </style>

    <script>
        // AAA Glitter/Magic Dust Canvas (Interactive Mouse Trails)
        const canvas = document.getElementById('glitter-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
            // Generate glowing dust on mousemove
            for(let i = 0; i < 4; i++) {
                particles.push(new Particle(mouse.x, mouse.y, true));
            }
        });

        class Particle {
            constructor(x, y, isInteractive = false) {
                this.x = x + (Math.random() - 0.5) * 30;
                this.y = y + (Math.random() - 0.5) * 30;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5 - 0.5;
                this.life = 1;
                this.decay = isInteractive ? (Math.random() * 0.03 + 0.02) : (Math.random() * 0.01 + 0.005);
                this.color = `hsl(${Math.random() * 60 + 180}, 100%, 70%)`; // Cyberpunk Cyan/Blue spectrum
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                this.size -= 0.02;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        // Ambient background drifting particles
        setInterval(() => {
            if(particles.length < 200) {
                particles.push(new Particle(Math.random() * width, Math.random() * height, false));
            }
        }, 100);

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0 || particles[i].size <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 3D AAA Tilt Effect on Game Cards (Vanilla JS)
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;
                card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1200px) rotateX(0) rotateY(0) scale(1)`;
            });
        });

        // Animated Odometer Jackpot
        let currentJackpot = 24942810.00;
        const jackpotEl = document.getElementById('jackpot');
        setInterval(() => {
            currentJackpot += (Math.random() * 15);
            jackpotEl.innerText = '$' + currentJackpot.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }, 2000);
    </script>
